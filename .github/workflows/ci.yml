name: Code Structure Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JSON files are valid
        run: |
          echo "::group::JSON syntax"
          fail=0
          for f in $(find . -name "*.json" -o -name "*.json5" | grep -v node_modules | head -50); do
            if [[ "$f" == *.json5 ]]; then continue; fi
            python3 -c "import json,sys; json.load(open('$f'))" 2>/dev/null || { echo "❌ invalid: $f"; fail=1; }
          done
          [[ $fail -eq 0 ]] && echo "✅ all JSON valid"
          echo "::endgroup::"

      - name: Check ArkTS files are non-empty
        run: |
          echo "::group::ArkTS files"
          n=$(find . -name "*.ets" | wc -l)
          echo "Found $n .ets files"
          empty=$(find . -name "*.ets" -size -10c | wc -l)
          echo "Empty files: $empty"
          [[ $empty -eq 0 ]] || { echo "❌ $empty empty .ets files"; exit 1; }
          echo "::endgroup::"

      - name: Count lines of code
        run: |
          echo "::group::LOC"
          echo "ArkTS: $(find . -name '*.ets' -exec cat {} + | wc -l) lines"
          echo "ArkTS files: $(find . -name '*.ets' | wc -l)"
          echo "Games: $(ls entry/src/main/ets/games/*.ets 2>/dev/null | wc -l)"
          echo "::endgroup::"

      - name: Verify no secrets committed
        run: |
          echo "::group::Secret scan"
          # DevEco 把签名口令存在 build-profile.json5 里，形式是 "0000001B<hex>"（本地密钥材料加密后的密文，
          # 离开本机 keystore 无法复用）⇒ 这类不算明文泄漏，只拦非该格式的口令。
          bad=$(grep -rhoE '"(storePassword|keyPassword)"[[:space:]]*:[[:space:]]*"[^"]*"' \
                  --include="*.json5" --include="*.json" . 2>/dev/null \
                | grep -vE ':[[:space:]]*"0000001B[0-9A-Fa-f]{16,}"' || true)
          if [ -n "$bad" ]; then
            echo "❌ plaintext signing credentials found:"
            echo "$bad" | sed -E 's/(:[[:space:]]*")[^"]*"/\1<redacted>"/'
            exit 1
          fi
          if grep -rlE "BEGIN [A-Z ]*PRIVATE KEY" --include="*.json5" --include="*.json" \
               --include="*.p12" --include="*.pem" --include="*.key" . 2>/dev/null | grep -v example; then
            echo "❌ private key material found!"
            exit 1
          fi
          echo "✅ no plaintext secrets found"
          echo "::endgroup::"
